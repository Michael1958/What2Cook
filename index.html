<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F6B2A">
<meta http-equiv="Cache-Control" content="no-cache">
<title>What to Cook</title>
<style>
:root{--olive:#4F6B2A;--olive-dk:#3C521F;--olive-lt:#E4EBD6;--terra:#C0522F;--terra-lt:#F6DED3;--cream:#F6F1E7;--card:#FFFDF8;--line:#E6DDCB;--text:#2E2A24;--muted:#7A7265;--amber:#E8A33D;--shadow:0 2px 10px rgba(60,50,30,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E2D3;color:var(--text);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;background:var(--cream);display:flex;flex-direction:column;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px;position:sticky;top:0;background:var(--cream);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:26px;color:var(--olive-dk);line-height:1.05}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card)}
.lang span{padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.lang span.on{background:var(--olive);color:#fff}
main{flex:1;padding:4px 14px 210px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px 14px;box-shadow:var(--shadow);margin:4px 0 12px}
.search input{border:0;outline:0;background:none;flex:1;font-size:15px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 10px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;min-width:76px;font-size:12px}
.chip .e{font-size:22px}
.chip.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .pic{height:78px;display:flex;align-items:center;justify-content:center;font-size:42px}
.tile .nm{padding:6px 9px 8px}
.tile .nm b{display:block;font-size:14px;font-weight:600}
.tile .nm small{color:var(--muted);font-size:11.5px}
.tile .ck{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--olive);color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;border:2px solid #fff}
.tile.on{border-color:var(--olive);outline:2px solid var(--olive)}
.tile.on .ck{display:flex}
.tile .always{position:absolute;top:6px;left:6px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px}
.c-veg{background:#EAF1DE}.c-meat{background:#F7E1DA}.c-fish{background:#DDEBF0}.c-dairy{background:#F8F0DA}.c-grains{background:#F4E9D2}.c-legumes{background:#EFE3D6}.c-herbs{background:#E2EEDC}.c-pantry{background:#EFE9DD}
#actionBar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:100%;max-width:560px;padding:0 12px;z-index:6}
.abar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 14px;box-shadow:0 4px 18px rgba(60,50,30,.15)}
.abar .cnt{flex:1;text-align:left}
.abar .cnt b{font-size:16px}
.abar .cnt small{display:block;color:var(--muted);font-size:12px}
.btn{background:var(--olive);color:#fff;border-radius:24px;padding:12px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:disabled{opacity:.45}
.btn.terra{background:var(--terra)}
.btn.ghost{background:var(--card);color:var(--olive-dk);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px}
nav#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.navrow{display:flex}
.navrow button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 4px;font-size:11px;color:var(--muted);position:relative}
.navrow button .i{font-size:20px;filter:grayscale(1);opacity:.75}
.navrow button.on{color:var(--olive-dk);font-weight:700}
.navrow button.on .i{filter:none;opacity:1}
.navrow .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--terra);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px}
.credit{text-align:center;font-size:11px;color:var(--muted);padding:3px 0 6px}
h2.sec{font-family:Georgia,serif;font-size:21px;color:var(--olive-dk);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
h2.sec.terra{color:var(--terra)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.best{display:flex;flex-direction:column}
.best .hero{height:130px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#EAF1DE,#F6DED3);position:relative}
.ribbon{position:absolute;top:10px;left:10px;background:var(--terra);color:#fff;font-weight:700;font-size:13px;padding:5px 10px;border-radius:14px}
.best .body{padding:12px 14px 14px}
.ttl{font-family:Georgia,serif;font-size:21px;margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text);margin:6px 0}
.reason{background:var(--olive-lt);color:var(--olive-dk);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;margin:8px 0}
.row{display:flex;gap:8px;align-items:center}
.ring{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:15px;line-height:1}
.ring small{font-size:9.5px;font-weight:500;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;align-items:stretch;text-align:left;width:100%}
.rcard .em{width:84px;flex:none;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#EAF1DE,#F8F0DA)}
.rcard .b{flex:1;padding:10px 10px 10px 12px;min-width:0}
.rcard .b b{font-size:16px;display:block}
.rcard .b .sub{margin:1px 0 4px}
.rcard .rr{display:flex;align-items:center;padding-right:10px}
.tag{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:10px;background:var(--olive-lt);color:var(--olive-dk);margin:2px 4px 2px 0}
.tag.t{background:var(--terra-lt);color:#8E3A1E}
.tag.a{background:#FBEBC9;color:#7A5410}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .e{font-size:54px}
.dhero{height:170px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:96px;background:linear-gradient(135deg,#EAF1DE,#F6DED3);position:relative;margin-top:4px}
.dhero .acts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.circ{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:19px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--olive-dk);font-weight:600;padding:4px 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.fact b{display:block;font-size:15px;color:var(--text)}
.stepper{display:flex;align-items:center;gap:8px;justify-content:center}
.stepper button{width:30px;height:30px;border-radius:50%;background:var(--olive);color:#fff;font-size:18px;line-height:1}
.tabs{display:flex;gap:6px;margin:12px 0 10px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:#EFE8DA;font-weight:600;font-size:14px}
.tabs button.on{background:var(--olive);color:#fff}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ilist li:last-child{border-bottom:0}
.ilist .q{margin-left:auto;font-weight:600;white-space:nowrap;font-size:14px}
.dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:none}
.dot.y{background:var(--olive)}.dot.n{background:var(--terra)}.dot.s{background:var(--amber)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.steps li.done{opacity:.5}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--olive);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.heat{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;margin-bottom:5px}
.h-0{background:#ECE6DA;color:#5C554A}.h-L{background:#FBEBC9;color:#7A5410}.h-M{background:#F9D7B9;color:#8A4A12}.h-H{background:#F4C3B4;color:#8E2A12}.h-O{background:#E9D3F0;color:#5B2C6F}
.nut .r{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.nut .bar{height:9px;background:#EFE8DA;border-radius:6px;overflow:hidden}
.nut .bar i{display:block;height:100%;border-radius:6px}
.note{font-size:12px;color:var(--muted);margin:8px 2px}
.hint{background:#FFF6E3;border:1px solid #F1DDB0;border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
.shopadd{display:flex;gap:8px;margin:6px 0 12px}
.shopadd input{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 14px;background:var(--card);outline:0;min-width:0}
.slist li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.slist li.done span.t{text-decoration:line-through;color:var(--muted)}
.slist input[type=checkbox]{width:22px;height:22px;accent-color:var(--olive);flex:none}
.slist .t{flex:1}
.slist .from{display:block;font-size:11.5px;color:var(--muted)}
.del{color:var(--terra);font-size:18px;padding:0 4px}
.set{padding:4px 14px}
.set h3{font-size:15px;margin:14px 0 6px;color:var(--olive-dk)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13.5px}
.opt.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.swrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw{width:44px;height:26px;border-radius:13px;background:#CFC6B4;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--olive)}
.sw.on::after{left:21px}
#sheet{position:fixed;inset:0;background:rgba(30,25,15,.4);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
.sheetbox{background:var(--cream);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px 24px;max-height:75vh;overflow:auto}
.selchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.selchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#2E2A24;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

function gramsOf(id,q,u){ const d=INGM[id]; if(!d) return 0; if(u==="g") return q; if(u==="ml") return q*d.dens; return q*(d.pw||0); }
RECIPES.forEach(r=>{
  r.total = r.st.reduce((a,s)=>a+(s[4]?0:s[0]),0);
  r.oven = r.st.some(s=>typeof s[1]==="number");
  const t=[0,0,0,0,0,0];
  r.ing.forEach(x=>{ const d=INGM[x[0]]; const g=gramsOf(x[0],x[1],x[2])*(x[4]==null?1:x[4]); d.n.forEach((v,i)=>t[i]+=v*g/100); });
  r.nut = t.map(v=>v/r.sv);
  const req = r.ing.filter(x=>x[3]!=="o").map(x=>INGM[x[0]]);
  r.alg = [...new Set(req.flatMap(d=>d.alg))];
  r.algOpt = [...new Set(r.ing.filter(x=>x[3]==="o").flatMap(x=>INGM[x[0]].alg))].filter(a=>!r.alg.includes(a));
  const an = new Set(req.map(d=>d.an).filter(Boolean));
  r.vegetarian = !an.has("meat") && !an.has("fish") && !an.has("shell");
  r.vegan = r.vegetarian && !an.has("dairy") && !an.has("egg");

/* ---------- Matching algorithm ---------- */
const W = {c:5,i:3,s:.5};
function has(id){ return id==="water" || S.selected.has(id) || S.staples.has(id); }
function subFor(id){ return (SUBS[id]||[]).find(x=>has(x)); }
function recentlyCooked(id){ const wk=7*864e5; return S.history.some(h=>h.id===id && Date.now()-h.at<wk); }
function timeFit(total){ const m=S.prefs.maxMin; if(!m||total<=m) return 1; return Math.max(0,1-(total-m)/m); }
function allowed(r){
  const p=S.prefs;
  if(p.diet==="vegetarian"&&!r.vegetarian) return false;
  if(p.diet==="vegan"&&!r.vegan) return false;
  if(p.diet==="lenten"&&!r.lenten) return false;
  if(p.allergies.some(a=>r.alg.includes(a))) return false;
  if(!p.oven&&r.oven) return false;
  if(p.maxMin&&(r.soak||r.total>p.maxMin*2)) return false;
  return true;
}
function evaluate(r){
  let num=0,den=0,mc=0,mi=0; const missing=[],subs=[];
  for(const [id,,,role] of r.ing){
    if(role==="o") continue;
    const w=W[role]; den+=w; let s=0;
    if(has(id)) s=1;
    else { const sb=subFor(id); if(sb){ s=.7; subs.push([id,sb]); } else { missing.push(id); if(role==="c") mc++; else if(role==="i") mi++; } }
    num+=w*s;
  }
  const C=den?num/den:0;
  const used=r.ing.filter(x=>S.selected.has(x[0])).length;
  const P=S.selected.size?Math.min(1,used/S.selected.size):0;
  const T_=timeFit(r.total), V=recentlyCooked(r.id)?0:1;
  const score=.60*C+.17*P+.10*r.g+.08*T_+.05*V;
  const coreOwned=r.ing.some(x=>x[3]==="c"&&(S.selected.has(x[0])||subFor(x[0])));
  let group=null;
  if(mc===0&&mi===0&&used>0) group="now";
  else if(mc+mi<=2&&mc<=1&&C>=.5&&coreOwned) group="almost";
  return {r,C,P,score,group,missing,subs,used,match:Math.round(C*100)};
}
function results(){
  const all=RECIPES.filter(allowed).map(evaluate).filter(e=>e.group).sort((a,b)=>b.score-a.score);
  return {now:all.filter(e=>e.group==="now"), almost:all.filter(e=>e.group==="almost")};
}
function reasonFor(e){
  const p=[];
  if(e.group==="now"&&!e.subs.length) p.push(t("haveAll")); else if(e.subs.length) p.push(t("subUsed"));
  if(e.used>1) p.push(t("usesN")(e.used));
  if(e.r.total<=30) p.push(t("quick")(e.r.total));
  if(p.length<2&&e.r.g===1) p.push(t("greek"));
  return p.slice(0,2).join(" · ");
}

  const stapleIds=["olive_oil","salt","pepper_black","oregano","garlic","onion","lemon","tomato_paste","vinegar","flour","rice","pasta"];
  return `<div class="set"><h2 class="sec">⚙ ${t("setTitle")}</h2>
   <h3>${t("language")}</h3><div class="opts">${o("lang","el","Ελληνικά",S.lang==="el")}${o("lang","en","English",S.lang==="en")}</div>
   <h3>${t("diet")}</h3><div class="opts">${o("diet","none",t("dNone"),p.diet==="none")}${o("diet","vegetarian",t("dVeg"),p.diet==="vegetarian")}${o("diet","vegan",t("dVegan"),p.diet==="vegan")}${o("diet","lenten",t("dLent"),p.diet==="lenten")}</div>
   <h3>${t("allerg")}</h3><div class="opts">${Object.keys(ALG).map(a=>o("alg",a,L(ALG[a]),p.allergies.includes(a))).join("")}</div>
   <h3>${t("time")}</h3><div class="opts">${[0,20,30,45,60].map(m=>o("time",m,m?"≤ "+m+" "+t("min"):t("any"),p.maxMin===m)).join("")}</div>
   <h3>${t("equip")}</h3><div class="swrow"><span>♨ ${t("ovenHave")}</span><button class="sw ${p.oven?"on":""}" id="ovenSw"></button></div>
   <h3>${t("staples")}</h3>${stapleIds.map(id=>`<div class="swrow"><span>${INGM[id].em} ${esc(L(INGM[id].name))}</span><button class="sw ${S.staples.has(id)?"on":""}" data-staple="${id}"></button></div>`).join("")}
   <h3>${t("about")}</h3><div class="card" style="padding:12px 14px;font-size:14px"><b>What to Cook</b> v${VERSION}<br>Created by: Michael Gerontides<br><span class="note">${t("localNote")}</span></div>
   <button class="btn sm ghost" id="resetAll" style="margin-top:12px;color:var(--terra)">${t("resetAll")}</button></div>`;
}

/* ---------- Render ---------- */
function render(){
  document.documentElement.lang=S.lang;
  document.getElementById("tagline").textContent=t("tag");
  document.getElementById("ver").textContent=VERSION;
  document.querySelectorAll("#langBtn span").forEach(s=>s.classList.toggle("on",s.dataset.l===S.lang));
  const views={ing:vIngredients,rec:vResults,detail:vDetail,saved:vSaved,shop:vShop,set:vSettings};
  document.getElementById("main").innerHTML=views[S.screen]();
  document.getElementById("actionBar").innerHTML=actionBar();
  document.getElementById("main").style.paddingBottom=S.screen==="ing"?"200px":"120px";
  const open=S.shop.filter(x=>!x.done).length;
  const nav=[["ing","🧺",t("navIng")],["rec","🍲",t("navRec")],["saved","❤️",t("navSaved")],["shop","🛒",t("navShop")],["set","⚙️",t("navSet")]];
  const cur=S.screen==="detail"?S.prevScreen:S.screen;
  document.getElementById("navrow").innerHTML=nav.map(([id,i,l])=>`<button data-go="${id}" class="${cur===id?"on":""}"><span class="i">${i}</span>${l}${id==="shop"&&open?`<span class="badge">${open}</span>`:""}</button>`).join("");
  bind();
}
function bind(){
  const $=s=>document.getElementById(s);
  const q=$("q");
  if(q){ q.oninput=()=>{ S.q=q.value; const pos=q.selectionStart; render(); const n=$("q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }; }
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ S.cat=b.dataset.cat; S.q=""; render(); });
  document.querySelectorAll("[data-ing]").forEach(b=>b.onclick=()=>{ const id=b.dataset.ing;
    if(S.staples.has(id)){ toast(t("alwaysToast")); return; }
    S.selected.has(id)?S.selected.delete(id):S.selected.add(id); S.bestIdx=0; persist(); render(); });
  if($("findBtn")) $("findBtn").onclick=()=>{ S.bestIdx=0; go("rec"); };
  if($("openSel")) $("openSel").onclick=openSheet;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRecipe(b.dataset.open));
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); toggleSave(b.dataset.save); });
  if($("another")) $("another").onclick=()=>{ S.bestIdx++; render(); };
  if($("backBtn")) $("backBtn").onclick=()=>go(S.prevScreen||"rec");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
  if($("svMinus")) $("svMinus").onclick=()=>{ if(S.servings>1){ S.servings--; render(); } };
  if($("svPlus")) $("svPlus").onclick=()=>{ if(S.servings<20){ S.servings++; render(); } };
  document.querySelectorAll("[data-step]").forEach(li=>li.onclick=()=>li.classList.toggle("done"));
  if($("addMissing")) $("addMissing").onclick=addMissing;
  if($("speak")) $("speak").onclick=speak;
  if($("cookedBtn")) $("cookedBtn").onclick=()=>{ S.history.push({id:S.recipeId,at:Date.now()}); S.history=S.history.slice(-100); persist(); toast(t("cookedT")); };
  if($("shopForm")) $("shopForm").onsubmit=ev=>{ ev.preventDefault(); const v=$("shopIn").value.trim(); if(!v) return; S.shop.unshift({id:Date.now()+""+Math.random().toString(36).slice(2,6),text:v,done:false}); persist(); render(); $("shopIn").focus(); };
  document.querySelectorAll("[data-chk]").forEach(c=>c.onchange=()=>{ const it=S.shop.find(x=>x.id===c.dataset.chk); if(it){ it.done=c.checked; persist(); render(); } });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.shop=S.shop.filter(x=>x.id!==b.dataset.del); persist(); render(); });
  if($("clearDone")) $("clearDone").onclick=()=>{ S.shop=S.shop.filter(x=>!x.done); persist(); render(); };
  if($("clearShop")) $("clearShop").onclick=()=>{ if(confirm(t("clearAll")+"?")){ S.shop=[]; persist(); render(); } };
  if($("shareShop")) $("shareShop").onclick=shareShop;
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ S.lang=b.dataset.lang; persist(); render(); });
  document.querySelectorAll("[data-diet]").forEach(b=>b.onclick=()=>{ S.prefs.diet=b.dataset.diet; persist(); render(); });
  document.querySelectorAll("[data-alg]").forEach(b=>b.onclick=()=>{ const a=b.dataset.alg, s=new Set(S.prefs.allergies); s.has(a)?s.delete(a):s.add(a); S.prefs.allergies=[...s]; persist(); render(); });
  document.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{ S.prefs.maxMin=+b.dataset.time; persist(); render(); });
  if($("ovenSw")) $("ovenSw").onclick=()=>{ S.prefs.oven=!S.prefs.oven; persist(); render(); };
  document.querySelectorAll("[data-staple]").forEach(b=>b.onclick=()=>{ const id=b.dataset.staple; if(S.staples.has(id)) S.staples.delete(id); else { S.staples.add(id); S.selected.delete(id); } persist(); render(); });
  if($("resetAll")) $("resetAll").onclick=()=>{ if(confirm(t("resetQ"))){ Object.keys(localStorage).filter(k=>k.startsWith("wtc_")).forEach(k=>localStorage.removeItem(k)); location.reload(); } };
}
document.getElementById("langBtn").onclick=()=>{ S.lang=S.lang==="el"?"en":"el"; persist(); render(); };

/* ---------- Selected ingredients sheet ---------- */
function openSheet(){
  const sh=document.getElementById("sheet");
  const draw=()=>{ const ids=[...S.selected];
    sh.innerHTML=`<div class="sheetbox"><div class="row" style="justify-content:space-between"><b style="font-size:18px">🧺 ${t("myIng")}: ${ids.length}</b><button class="btn sm ghost" id="shClose">${t("close")}</button></div>
      ${ids.length?`<div class="selchips">${ids.map(id=>`<span class="selchip">${INGM[id].em} ${esc(L(INGM[id].name))} <button data-rm="${id}" class="del">✕</button></span>`).join("")}</div>
      <button class="btn sm ghost" id="shClear" style="color:var(--terra)">${t("clearAll")}</button>`:`<p class="note">${t("selectedNone")}</p>`}</div>`;
    sh.querySelector("#shClose").onclick=close;
    sh.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ S.selected.delete(b.dataset.rm); persist(); draw(); });
    const c=sh.querySelector("#shClear"); if(c) c.onclick=()=>{ S.selected.clear(); persist(); draw(); };
  };
  const close=()=>{ sh.classList.remove("show"); render(); };
  sh.onclick=e=>{ if(e.target===sh) close(); };
  draw(); sh.classList.add("show");
}

/* ---------- Shopping list ---------- */
function addMissing(){
  const r=RM[S.recipeId], e=evaluate(r), k=S.servings/r.sv;
  const opt=r.ing.filter(x=>x[3]==="o"&&!has(x[0])).map(x=>x[0]);
  const ids=[...e.missing,...opt].filter(id=>id!=="water");
  let n=0;
  ids.forEach(id=>{ if(S.shop.some(x=>x.ing===id&&!x.done)) return; const x=r.ing.find(y=>y[0]===id);
    S.shop.unshift({id:Date.now()+id,ing:id,qty:qtyText(id,x[1],x[2],k),from:r.id,done:false}); n++; });
  persist(); toast(n?t("added")+" ("+n+")":t("nothingMissing")); render();
}
function shareShop(){
  const txt="🛒 "+t("shopTitle")+"\n"+S.shop.filter(x=>!x.done).map(x=>"• "+itemLabel(x)).join("\n")+"\n\nWhat to Cook v"+VERSION;
  if(navigator.share) navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast(t("copied")));
}

/* ---------- Read aloud ---------- */
let speaking=false;
function stopSpeech(){ if("speechSynthesis" in window) speechSynthesis.cancel(); speaking=false; }
function speak(){
  if(!("speechSynthesis" in window)) return;
  if(speaking){ stopSpeech(); render(); return; }
  const r=RM[S.recipeId], k=S.servings/r.sv, el=S.lang==="el";
  const parts=[el?r.el:r.en, t("tIng")+": "+r.ing.filter(x=>x[0]!=="water").map(x=>L(INGM[x[0]].name)+", "+qtyText(x[0],x[1],x[2],k)).join(". ")];
  r.st.forEach((s,i)=>parts.push((i+1)+". "+heatSpeech(s[1])+", "+s[0]+" "+(el?"λεπτά":"minutes")+". "+(el?s[2]:s[3])));
  const u=new SpeechSynthesisUtterance(parts.join(". "));
  u.lang=el?"el-GR":"en-GB";
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(el?"el":"en"));
  if(v) u.voice=v;
  u.onend=()=>{ speaking=false; render(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u); speaking=true; render();
}

/* ---------- Start on the ingredient screen (Mockup #1) ---------- */
S.screen="ing";
render();
</script>
